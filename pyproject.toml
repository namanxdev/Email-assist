[project]
name = "outlook-adk-agent"
version = "0.1.0"
description = "Local email assistant agent: Google ADK + Microsoft Graph (Outlook)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-adk>=2.13.0",
    "httpx>=0.28.1",
    "msal>=1.39.0",
    "python-dotenv>=1.2.4",
    "tzdata>=2026.6",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "respx>=0.23.1",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
